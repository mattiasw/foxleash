<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Foxhand</title>
    <link rel="stylesheet" href="pages.css">
  </head>
  <body>
    <main>
      <h1 id="heading">Foxhand</h1>
      <p id="target"></p>
      <p id="credentials" hidden>This address also contains a user name or password, which the site receives.</p>
      <p>This session: until the agent's session ends. Always: until you revoke it in Foxhand's settings.</p>
      <div id="answers" class="answers">
        <button type="button" data-answer="no" aria-disabled="true">Don't allow</button>
        <button type="button" data-answer="once" aria-disabled="true">Allow this session</button>
        <button type="button" data-answer="always" aria-disabled="true">Always allow</button>
      </div>
      <p id="status" role="status" aria-live="polite" tabindex="-1"></p>
      <div id="after" hidden>
        <button type="button" id="back" hidden>Go back</button>
        <p id="close" hidden>You can close this tab.</p>
      </div>
    </main>
    <script src="approve.js"></script>
  </body>
</html>
