<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Foxhand settings</title>
    <link rel="stylesheet" href="pages.css">
  </head>
  <body>
    <main>
      <h1>Foxhand settings</h1>
      <section aria-labelledby="sites-heading">
        <h2 id="sites-heading" tabindex="-1">Sites allowed always</h2>

        <p id="sites-empty" hidden>No sites are allowed always.</p>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
