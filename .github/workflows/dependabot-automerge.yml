name: Auto-merge Dependabot

on:
  workflow_run:
    workflows:
      - "CI"
    types: [completed]
    # A cost filter only, so no run starts for CI on other branches; the PR author check below
    # decides whether to merge.
    branches: ["dependabot/**"]

# Per-job permissions only, so no token holds both contents: write and actions: write.
permissions: {}

# One merge attempt per head sha at a time, so a re-run cannot race another into `gh pr merge`.
concurrency:
  group: automerge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  automerge:
    # Any successful completion re-checks; only a pull_request run vouches for the merge (the
    # required-workflow check below counts no other event). An event filter here would skip a
    # later completion, such as a workflow_dispatch run finishing after the pull_request run, and
    # the PR would wait for its next push.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - name: Check all checks passed and merge
        id: merge
        # GitHub context values reach the script only through env:, never interpolated into
        # run:, so a crafted branch or workflow name cannot inject a command.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGERING_WORKFLOW: ${{ github.event.workflow_run.name }}
          REPO: ${{ github.repository }}
        run: |
          REQUIRED_WORKFLOWS=(
            "CI"
          )

          # Triggered by a workflow not in the required list means the two lists in this file
          # are out of sync.
          IS_TRIGGER_REQUIRED=false
          for REQUIRED_WORKFLOW in "${REQUIRED_WORKFLOWS[@]}"; do
            if [ "$TRIGGERING_WORKFLOW" = "$REQUIRED_WORKFLOW" ]; then
              IS_TRIGGER_REQUIRED=true
            fi
          done
          if [ "$IS_TRIGGER_REQUIRED" != "true" ]; then
            echo "::error::Triggered by workflow \"$TRIGGERING_WORKFLOW\" which is not in the required list. Update workflow names in dependabot-automerge.yml."
            exit 1
          fi

          # Find the Dependabot PR for this commit. gh lists 30 PRs unless told otherwise, so
          # with more open an older Dependabot PR would never be found.
          PR=$(gh pr list --repo "$REPO" \
            --state open --limit 1000 --json number,headRefOid,author \
            --jq ".[] | select(.headRefOid == \"$SHA\" and (.author.login == \"dependabot[bot]\" or .author.login == \"app/dependabot\")) | .number")
          if [ -z "$PR" ]; then
            echo "No open Dependabot PR found for $SHA"
            exit 0
          fi

          # Only pull_request runs count: a push or workflow_dispatch run tests the branch head,
          # not its merge with main. A run still in progress means "not ready"; a required
          # workflow with no pull_request run for this sha is an error (its trigger no longer
          # fires, or the names drifted), not a wait that never ends. Runs from fork PRs with
          # the same sha do not count: a later one could hide a failed run.
          if ! WORKFLOW_RUNS=$(gh api \
            "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
            --jq '.workflow_runs'); then
            echo "Failed to fetch workflow runs for $SHA"
            exit 1
          fi
          ARE_REQUIRED_WORKFLOWS_SUCCESSFUL=true
          for REQUIRED_WORKFLOW in "${REQUIRED_WORKFLOWS[@]}"; do
            WORKFLOW_CONCLUSION=$(echo "$WORKFLOW_RUNS" | jq -r \
              --arg WORKFLOW_NAME "$REQUIRED_WORKFLOW" \
              'map(select(.name == $WORKFLOW_NAME and .event == "pull_request" and .head_repository.id == .repository.id))
                | if length == 0 then "not started"
                  else (sort_by(.run_started_at // .created_at) | last | .conclusion // "in progress")
                  end')
            if [ "$WORKFLOW_CONCLUSION" = "not started" ]; then
              echo "::error::Required workflow \"$REQUIRED_WORKFLOW\" has no pull_request run for $SHA; its pull_request trigger no longer fires or the workflow names are out of sync."
              exit 1
            fi
            if [ "$WORKFLOW_CONCLUSION" != "success" ]; then
              echo "Workflow \"$REQUIRED_WORKFLOW\" is \"$WORKFLOW_CONCLUSION\" for $SHA"
              ARE_REQUIRED_WORKFLOWS_SUCCESSFUL=false
            fi
          done
          if [ "$ARE_REQUIRED_WORKFLOWS_SUCCESSFUL" != "true" ]; then
            echo "Required workflows are not fully successful yet, not merging."
            exit 0
          fi

          # Verify all PR checks are passing or skipped.
          CHECKS=$(gh pr checks "$PR" --repo "$REPO" --json name,bucket) || true
          if ! echo "$CHECKS" | jq -e 'type == "array"' > /dev/null; then
            echo "Failed to fetch checks for PR #$PR"
            exit 1
          fi
          BLOCKING=$(echo "$CHECKS" | jq '[.[] | select(.bucket != "pass" and .bucket != "skipping")] | length')
          if [ "$BLOCKING" != "0" ]; then
            echo "Checks still pending or failing, not merging:"
            # Names printed as JSON, so a name holding a newline cannot start a line with a
            # workflow command such as one setting the merged output.
            echo "$CHECKS" | jq -r '.[] | select(.bucket != "pass" and .bucket != "skipping") | "\(.name | tojson): \(.bucket)"'
            exit 0
          fi

          echo "All checks passed, merging PR #$PR"
          # A merge can fail with nothing to fix, as when another merge moved main at the same
          # moment ("Base branch was modified"), and nothing else retries it: the head did not
          # change, so no new CI run comes. So a PR still open on the checked sha, or whose state
          # could not be read, is tried again. --match-head-commit binds every attempt to that sha:
          # GitHub refuses the merge when the branch moved, so an untested head is never merged.
          MERGE_ATTEMPTS=3
          for ((ATTEMPT = 1; ATTEMPT <= MERGE_ATTEMPTS; ATTEMPT++)); do
            if gh pr merge "$PR" --squash --delete-branch --match-head-commit "$SHA" --repo "$REPO"; then
              echo "merged=true" >> "$GITHUB_OUTPUT"
              break
            fi
            # A failed read leaves PR_STATE empty, which is retried and never reads as merged.
            PR_INFO=$(gh pr view "$PR" --repo "$REPO" --json state,headRefOid --jq '.state + " " + .headRefOid') || PR_INFO=""
            read -r PR_STATE PR_HEAD <<< "$PR_INFO"
            if [ "$PR_STATE" = "MERGED" ]; then
              # gh can fail after this run's merge landed (deleting the branch, a lost response).
              echo "PR #$PR is merged."
              echo "merged=true" >> "$GITHUB_OUTPUT"
              break
            elif [ "$PR_STATE" = "OPEN" ] && [ -n "$PR_HEAD" ] && [ "$PR_HEAD" != "$SHA" ]; then
              echo "::notice::PR #$PR's head moved to $PR_HEAD since its checks ran on $SHA; the new head's CI run retries the merge."
              break
            elif [ "$ATTEMPT" -lt "$MERGE_ATTEMPTS" ] && { [ "$PR_STATE" = "OPEN" ] || [ -z "$PR_STATE" ]; }; then
              echo "Merging PR #$PR failed (state: ${PR_STATE:-unknown}); trying again in 15 seconds."
              sleep 15
            else
              echo "::error::Failed to merge PR #$PR (state: ${PR_STATE:-unknown})."
              exit 1
            fi
          done

  # A merge made with GITHUB_TOKEN starts no push run on main; a workflow_dispatch made with it
  # does start one.
  ci-on-main:
    needs: automerge
    if: needs.automerge.outputs.merged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Run CI on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        # A dispatch that started CI but lost its response starts a second run; ci.yml's
        # concurrency group cancels the first.
        run: |
          DISPATCH_ATTEMPTS=3
          for ((ATTEMPT = 1; ATTEMPT <= DISPATCH_ATTEMPTS; ATTEMPT++)); do
            if gh workflow run ci.yml --ref main --repo "$REPO"; then
              exit 0
            fi
            if [ "$ATTEMPT" -lt "$DISPATCH_ATTEMPTS" ]; then
              echo "Starting CI on main failed; trying again in 15 seconds."
              sleep 15
            fi
          done
          echo "::error::Could not start CI on main. Re-run this failed job, or run: gh workflow run ci.yml --ref main"
          exit 1
