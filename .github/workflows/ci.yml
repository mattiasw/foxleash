name: CI

on:
  push:
    branches: [main, "gate/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:release -- changelog
      - run: npm run check:release -- listing
      - name: Test integrity
        run: npm run check:test-integrity
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'none' }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: AMO source archive
        run: npm run build:amo

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: ~/.cache/foxhand-firefox
          key: firefox-${{ runner.os }}-${{ hashFiles('bin/firefox-version.json') }}
      - run: npm run e2e
