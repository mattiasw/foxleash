name: CI

on:
  push:
    branches: [main, "gate/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A commit pushed to main after it passed CI on a gate/ branch is not tested again.
  gate-result:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.find.outputs.passed }}
    steps:
      - name: Find a successful gate run of this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        # An answer that cannot be read runs the whole CI.
        run: |
          if ! PASSED=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&event=push&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and (.head_branch | startswith("gate/")))] | length > 0'); then
            PASSED=false
          fi
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"

  validate:
    needs: gate-result
    if: ${{ !cancelled() && needs.gate-result.outputs.passed != 'true' }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:release -- changelog
      - run: npm run check:release -- listing
      - run: npm run check:release -- protocol
      # A pull request compares with its base branch. Every other run compares with the nearest
      # commit in its history (topological order) whose successful CI run ran this check, or with a
      # pinned start commit, so a cancelled run or a gate branch's first push leaves no commit
      # unchecked (github.event.before does not).
      - name: Find the commit the test integrity check compares with
        id: integrity-base
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          BASE=$(node bin/ci-integrity-base.ts)
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
      - name: Test integrity
        run: npm run check:test-integrity
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || steps.integrity-base.outputs.sha }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: AMO source archive
        run: npm run build:amo

  e2e:
    name: e2e (${{ matrix.firefox }}, ${{ matrix.shard }}/3)
    needs: gate-result
    if: ${{ !cancelled() && needs.gate-result.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        firefox: [release, esr]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: ~/.cache/foxleash-firefox
          key: firefox-${{ runner.os }}-${{ matrix.firefox }}-${{ hashFiles(matrix.firefox == 'esr' && 'bin/firefox-esr-version.json' || 'bin/firefox-version.json') }}
      # The shard goes through the environment: npm appends arguments after the test file glob.
      # The 3 is the shard count per Firefox, not strategy.job-total, which counts both pins' jobs.
      # A limit of its own, inside the job's 20 minutes, ends a hung run with SIGTERM so that the
      # test reporter prints what was running.
      - run: timeout --signal=TERM --kill-after=30s 15m npm run e2e
        env:
          FOXLEASH_E2E_FIREFOX: ${{ matrix.firefox }}
          FOXLEASH_E2E_SHARD: ${{ matrix.shard }}/3
