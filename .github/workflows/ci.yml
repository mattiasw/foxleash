name: CI

on:
  push:
    branches: [main, "gate/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:release -- changelog
      - run: npm run check:release -- listing
      - run: npm run check:release -- protocol
      - name: Test integrity
        run: npm run check:test-integrity
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'none' }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: AMO source archive
        run: npm run build:amo

  e2e:
    name: e2e (${{ matrix.firefox }}, ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        firefox: [release, esr]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: ~/.cache/foxleash-firefox
          key: firefox-${{ runner.os }}-${{ matrix.firefox }}-${{ hashFiles(matrix.firefox == 'esr' && 'bin/firefox-esr-version.json' || 'bin/firefox-version.json') }}
      # The shard goes through the environment: npm appends arguments after the test file glob.
      # The 3 is the shard count per Firefox, not strategy.job-total, which counts both pins' jobs.
      - run: npm run e2e
        env:
          FOXLEASH_E2E_FIREFOX: ${{ matrix.firefox }}
          FOXLEASH_E2E_SHARD: ${{ matrix.shard }}/3
