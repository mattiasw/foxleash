name: Publish npm package

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# Every script then runs with pipefail.
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      node-version: ${{ steps.tag.outputs.node-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # GitHub context values reach scripts only through env:, never interpolated into run:.
      - name: Check the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          npm run check:release -- tag "$TAG"
          NODE_VERSION=$(< .nvmrc)
          if ! [[ "$NODE_VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::.nvmrc holds no Node version this workflow can pass on."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "node-version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
      # Anonymous callers get only public listed versions, newest first, 25 a page; an add-on with
      # none answers 401.
      - name: Wait until AMO serves the version publicly
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          ADDON_ID=$(jq -er '.browser_specific_settings.gecko.id | strings | select(length > 0) | @uri' apps/extension/manifest.json)
          URL="https://addons.mozilla.org/api/v5/addons/addon/$ADDON_ID/versions/"
          DEADLINE=$((SECONDS + 1800))
          while true; do
            if BODY=$(curl --silent --show-error --fail --max-time 30 "$URL") &&
              jq -e --arg version "$VERSION" \
                'any(.results[]?; .version == $version and .channel == "listed" and .file.status == "public")' \
                <<< "$BODY" > /dev/null; then
              echo "AMO serves $VERSION publicly."
              exit 0
            fi
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::AMO does not serve v$VERSION publicly yet. Re-run this workflow once it does."
              exit 1
            fi
            sleep 60
          done
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # build.ts itself: turbo's cached build could restore an old dist.
      - run: npm run build -w @foxleash/server
      - name: Pack the package
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          EXPECTED=$'package/LICENSE\npackage/README.md\npackage/THIRD_PARTY_NOTICES.md\npackage/foxleash.mjs\npackage/package.json'
          check_tarball() {
            shopt -s nullglob dotglob
            local files=("$1"/*)
            local tarball="$1/foxleash-$VERSION.tgz"
            if [ "${#files[@]}" -ne 1 ] || [ "${files[0]}" != "$tarball" ] || [ ! -f "$tarball" ] || [ -L "$tarball" ]; then
              echo "::error::$1 must hold exactly one file, foxleash-$VERSION.tgz; it holds ${#files[@]}."
              exit 1
            fi
            local entries
            entries=$(tar --ignore-zeros -tzf "$tarball" | LC_ALL=C sort)
            if [ "$entries" != "$EXPECTED" ]; then
              echo "Entries found: ${entries//$'\n'/ }"
              echo "::error::foxleash-$VERSION.tgz must hold exactly the five package files, each once."
              exit 1
            fi
            local listing line
            listing=$(tar --ignore-zeros -tvzf "$tarball")
            while IFS= read -r line; do
              if [[ "$line" != -* ]]; then
                echo "::error::every entry of foxleash-$VERSION.tgz must be a regular file."
                exit 1
              fi
            done <<< "$listing"
          }
          DIR="$RUNNER_TEMP/npm-package"
          mkdir "$DIR"
          npm pack ./apps/server/dist --ignore-scripts --pack-destination "$DIR"
          check_tarball "$DIR"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/foxleash-${{ steps.tag.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 1
          # A re-run of this job replaces the artifact of an earlier attempt.
          overwrite: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # npm's trusted publisher names this environment.
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.build.outputs.node-version }}
          registry-url: https://registry.npmjs.org
      - name: Check npm
        run: |
          NPM_VERSION=$(npm --version)
          if ! [[ "$NPM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            ! printf '%s\n' 11.5.1 "$NPM_VERSION" | sort -V -C; then
            echo "::error::npm $NPM_VERSION is older than 11.5.1, the first npm with trusted publishing."
            exit 1
          fi
      # Outside the workspace, so npm reads no .npmrc from the artifact as project config.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package
      # GNU tar and npm can read one archive differently, so npm publishes a tarball it packed
      # from exactly the files checked here.
      - name: Check the package
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || [ "$TAG" != "v$VERSION" ]; then
            echo "::error::the build's version is not x.y.z, or the release's tag is not v and that version."
            exit 1
          fi
          EXPECTED=$'package/LICENSE\npackage/README.md\npackage/THIRD_PARTY_NOTICES.md\npackage/foxleash.mjs\npackage/package.json'
          check_tarball() {
            shopt -s nullglob dotglob
            local files=("$1"/*)
            local tarball="$1/foxleash-$VERSION.tgz"
            if [ "${#files[@]}" -ne 1 ] || [ "${files[0]}" != "$tarball" ] || [ ! -f "$tarball" ] || [ -L "$tarball" ]; then
              echo "::error::$1 must hold exactly one file, foxleash-$VERSION.tgz; it holds ${#files[@]}."
              exit 1
            fi
            local entries
            entries=$(tar --ignore-zeros -tzf "$tarball" | LC_ALL=C sort)
            if [ "$entries" != "$EXPECTED" ]; then
              echo "Entries found: ${entries//$'\n'/ }"
              echo "::error::foxleash-$VERSION.tgz must hold exactly the five package files, each once."
              exit 1
            fi
            local listing line
            listing=$(tar --ignore-zeros -tvzf "$tarball")
            while IFS= read -r line; do
              if [[ "$line" != -* ]]; then
                echo "::error::every entry of foxleash-$VERSION.tgz must be a regular file."
                exit 1
              fi
            done <<< "$listing"
          }
          check_tarball "$RUNNER_TEMP/npm-package"
          UNPACKED="$RUNNER_TEMP/npm-unpacked"
          mkdir "$UNPACKED"
          tar --ignore-zeros -xzf "$RUNNER_TEMP/npm-package/foxleash-$VERSION.tgz" --no-same-owner -C "$UNPACKED" -- \
            package/LICENSE package/README.md package/THIRD_PARTY_NOTICES.md package/foxleash.mjs package/package.json
          if ! jq -e -s --arg version "$VERSION" \
            'length == 1 and (.[0] | type == "object" and (has("publishConfig") | not) and (has("scripts") | not) and .name == "foxleash" and .version == $version)' \
            "$UNPACKED/package/package.json" > /dev/null; then
            echo "::error::package/package.json must be one JSON object with no publishConfig and no scripts, name foxleash and version $VERSION."
            exit 1
          fi
          mkdir "$RUNNER_TEMP/npm-publish"
          npm pack "$UNPACKED/package" --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-publish"
          check_tarball "$RUNNER_TEMP/npm-publish"
      - name: Publish
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: npm publish "$RUNNER_TEMP/npm-publish/foxleash-$VERSION.tgz" --provenance --access public --ignore-scripts
