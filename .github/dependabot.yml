# No commit-message prefix on purpose: Dependabot's "Bump ..." subjects match this project's commit style.
version: 2
updates:
  # The root lockfile covers every workspace; per-workspace entries break grouped updates.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "05:00"
      timezone: "Europe/Stockholm"
    versioning-strategy: increase
    cooldown:
      default-days: 3
    groups:
      # A group's applies-to defaults to version-updates, so without the security mirrors
      # security fixes arrive one pull request per advisory.
      dev:
        applies-to: version-updates
        dependency-type: "development"
      production:
        applies-to: version-updates
        dependency-type: "production"
      dev-security:
        applies-to: security-updates
        dependency-type: "development"
      production-security:
        applies-to: security-updates
        dependency-type: "production"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "05:00"
      timezone: "Europe/Stockholm"
    cooldown:
      default-days: 3
